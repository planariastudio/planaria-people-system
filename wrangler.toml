# Cloudflare Worker deploy config. Lets you run `wrangler deploy` instead of
# pasting worker/index.js into the dashboard — every deploy becomes a reviewable
# git diff, and `npm run deploy` runs the syntax gate + tests first (predeploy).
#
# ─────────────────────────────────────────────────────────────────────────────
# BEFORE YOUR FIRST `wrangler deploy`, verify these against the live worker:
#   Cloudflare dashboard → Workers → planaria-people-worker → Settings.
# `wrangler deploy` REPLACES the worker's bindings + compatibility settings with
# what's in THIS file. Secrets are NOT touched (they persist across deploys), but
# the browser binding and compatibility date/flags below must match what the live
# worker already uses, or PDF rendering can break. If unsure, paste-deploy still
# works as a fallback — this file is additive, it doesn't remove that option.
# ─────────────────────────────────────────────────────────────────────────────

name = "planaria-people-worker"
main = "worker/index.js"

# Match the date shown in the dashboard's Settings → Compatibility.
# VERIFIED against the live worker 2026-09-19: dashboard reads 2026-07-09.
# The previous value here was 2024-09-23, which would have rolled the runtime
# back nearly two years on the first `wrangler deploy`. Do not change it without
# re-checking the dashboard.
compatibility_date = "2026-07-09"

# The worker imports `node:buffer`; nodejs_compat is required for it to run.
compatibility_flags = ["nodejs_compat"]

# The forms call https://planaria-people-worker.planariastudio.workers.dev, which
# is a workers.dev subdomain and not a route. Wrangler defaults this to true when
# no routes are declared, so leaving it out would work -- but the whole point of
# the warning at the top of this file is that a deploy REPLACES settings, and a
# setting that survives by default is one nobody notices until a version of
# wrangler changes the default. Declared, so the forms cannot lose their endpoint.
workers_dev = true

# Cloudflare browser rendering, used by renderPdf() for all PDF attachments.
# `env.MYBROWSER` in the code binds to this. Must stay declared or deploying via
# wrangler would drop the binding and every PDF render would throw.
browser = { binding = "MYBROWSER" }

# Secrets (NOT stored here — set once via the dashboard or `wrangler secret put`):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, CLICKUP_TOKEN, CLICKUP_LIST_ID,
#   CLICKUP_SPACE_ID, CONFIG_SYNC_TOKEN, SHEET_WEBHOOK_URL, PEER_ADMIN_KEY,
#   PEER_VIEW_KEY (optional)
# They survive `wrangler deploy` untouched.
#
# GoodDay, for the migration. All three are secrets, set the same way:
#   GOODDAY_TOKEN         org API token, from Settings -> API
#   GOODDAY_BOT_USER_ID   who actions are attributed to; GoodDay requires it
#   GOODDAY_TEAM_ID       the "Team" project under People (JORtmi)
#   GOODDAY_ENABLED       "1" sends every task operation to GoodDay instead of
#                         ClickUp. Leave it unset until the first three are set
#                         AND the roster has GoodDay accounts, or tasks will be
#                         created unassigned. Deploying this file does not flip
#                         it; it is a secret and deploys do not touch secrets.
#
# The ClickUp secrets stay set. The switch is one-way in intent but not in
# mechanism: unsetting GOODDAY_ENABLED puts everything back on ClickUp without a
# redeploy, which is the whole reason it is a flag and not a rewrite.
